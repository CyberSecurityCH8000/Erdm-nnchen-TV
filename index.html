<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142438"><link rel="manifest" href="manifest.json"><title>Erdmännchen TV</title><style>body{background:#142438;color:white;font:17px system-ui;max-width:600px;margin:auto;padding:24px}label{display:block;margin-top:20px}input,textarea,select,button,a.action{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;font:inherit;margin-top:6px}button,a.action{background:#b9e4ff;color:#142438;font-weight:bold;display:block;text-align:center}img,video{max-width:100%;border-radius:12px}small{color:#c4d5e6}</style><h1>🐾 Erdmännchen TV</h1><p>Nur kostenlos · 30 Sekunden · 720p · mit Wasserzeichen</p><form id="f"><label>Stork API-Schlüssel (separates Konto)</label><input id="key" type="password" required autocomplete="off"><label>Bild aus Galerie</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required><img id="preview" hidden><label>Dein Sprechertext</label><textarea id="script" rows="5" maxlength="650" required></textarea><small id="count">0 Zeichen</small><label>Deutsche Stimme</label><select id="voice" required><option value="">Stimmen laden</option></select><button type="button" id="load">Deutsche Stimmen laden</button><label>Format</label><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option><option>original</option></select><label><input type="checkbox" required style="width:auto"> Ich darf dieses Bild verwenden und als KI-Video kennzeichnen.</label><button id="go">Kostenloses Video erstellen</button></form><p id="status" role="status"></p><video id="video" controls playsinline hidden></video><a id="download" class="action" hidden style="display:none">MP4 öffnen / speichern</a><button id="share" hidden style="display:none">MP4 teilen</button><p><a style="color:white" href="https://www.stork.ai/dashboard">Stork-Konto und API-Schlüssel</a></p><script>const $=id=>document.getElementById(id),base='https://api.stork.ai/api/v1';let url;function msg(s){$('status').textContent=s} $('script').oninput=()=>{$('count').textContent=$('script').value.length+'/650 Zeichen · ca. '+Math.ceil($('script').value.length/15)+' Sekunden (Schätzung)'};$('photo').onchange=()=>{let f=$('photo').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').hidden=false}};async function req(path,opts={}){let r=await fetch(base+path,opts),j=await r.json();if(!r.ok)throw Error(j.error?.message||'HTTP '+r.status);return j} $('load').onclick=async()=>{try{let j=await req('/voices?language=de'),v=Array.isArray(j)?j:j.voices||j.data;if(!Array.isArray(v)||!v.length)throw Error('Keine Stimmen gefunden');$('voice').replaceChildren(...v.map(x=>new Option(x.name+' · '+(x.gender||''),x.id)));msg('Stimmen geladen')}catch(e){msg('Stimmen nicht verfügbar: '+e.message)}};$('f').onsubmit=async e=>{e.preventDefault();let f=$('photo').files[0],t=$('script').value.trim();if(f.size>12*1024*1024||!t||t.length>650)return msg('Bild maximal 12 MB, Text maximal 650 Zeichen.');$('go').disabled=true;let auth={Authorization:'Bearer '+$('key').value.trim()};try{msg('Bild wird zu Stork hochgeladen…');let u=await req('/uploads',{method:'POST',headers:{...auth,'Content-Type':f.type},body:f});if(!u.url)throw Error('Upload ohne Bildadresse');msg('Kostenloser Auftrag wird gesendet…');let j=await req('/talking-photo',{method:'POST',headers:{...auth,'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({image_url:u.url,text:t,voice_id:$('voice').value,aspect_ratio:$('ratio').value,tier:'free',quality:'standard',resolution:'720p'})});for(let n=0;n<120;n++){if(j.status==='succeeded'){url=j.video_url;if(!url)throw Error('Video fehlt');$('video').src=url;$('video').hidden=false;$('download').href=url;$('download').download='erdmaennchen.mp4';$('download').style.display='block';$('share').style.display='block';msg('Video fertig');return}if(j.status==='failed')throw Error(j.error?.message||'Rendering fehlgeschlagen');msg('Video wird erstellt… '+Math.round((j.progress||0)*100)+' %');let id=j.id;if(!id)throw Error('Auftrags-ID fehlt');await new Promise(r=>setTimeout(r,10000));j=await req('/talking-photo?id='+encodeURIComponent(id),{headers:auth})}msg('Auftrag noch nicht fertig. Bitte im Stork-Konto prüfen. Kein neuer Auftrag.')}catch(e){msg('Auftrag gestoppt: '+e.message+' · Netzwerk, Browserfreigabe oder Freikontingent prüfen. Kein kostenpflichtiger Ersatzauftrag.')}finally{$('go').disabled=false}};$('share').onclick=async()=>{try{let r=await fetch(url);if(!r.ok)throw Error();let file=new File([await r.blob()],'erdmaennchen.mp4',{type:'video/mp4'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file]});else throw Error()}catch(e){msg('Bitte MP4 über den Download öffnen und anschließend über WhatsApp teilen.')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></html>
